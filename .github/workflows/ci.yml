name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, build and verify artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build and verify artifacts
        run: npm run ci

      - name: Upload built userscript
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-plus-${{ github.sha }}
          path: |
            dist/youtube-plus.user.js
            dist/youtube-plus.meta.js
          if-no-files-found: ignore
          retention-days: 14
